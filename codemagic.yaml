# Sakina — Flutter. Même structure que Puzzelo (intégration Apple autorent_asc).
#
# Secrets (jamais dans ce dépôt) : groupe Codemagic « sakina_env »
#   CERTIFICATE_PRIVATE_KEY  clé privée RSA du certificat Apple Distribution (secure)
definitions:
  flutter_env: &flutter_env
    flutter: 3.47.0
    xcode: latest
  verify: &verify
    name: Vérifier Flutter
    script: |
      set -e
      flutter pub get
      flutter analyze
      flutter test

workflows:
  ios-testflight:
    name: Sakinah iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: autorent_asc
    environment:
      <<: *flutter_env
      groups:
        - sakina_env
      vars:
        BUNDLE_ID: com.mugi07.sakinah
        APP_VERSION: "1.0.0"
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - *verify
      - name: Initialiser le trousseau
        script: keychain initialize
      - name: Récupérer ou créer les fichiers de signature
        script: |
          set -euo pipefail
          : "${CERTIFICATE_PRIVATE_KEY:?CERTIFICATE_PRIVATE_KEY manque dans sakina_env}"
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          case "$CERTIFICATE_PRIVATE_KEY" in
            *BEGIN*) printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$key_file" ;;
            *) printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '[:space:]' | openssl base64 -d -A > "$key_file" ;;
          esac
          openssl pkey -in "$key_file" -check -noout > /dev/null 2>&1
          # --create : le profil App Store de ce nouveau bundle n'existe pas encore.
          # Le certificat existant correspondant à la clé est réutilisé.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key "@file:$key_file" --create
          keychain add-certificates
      - name: Appliquer les profils au projet Flutter
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Construire l’IPA Flutter
        script: |
          set -euo pipefail
          flutter build ipa --release --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-build-only:
    name: Sakinah iOS — compilation seule
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter_env
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - *verify
      - name: Compiler sans signature
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
