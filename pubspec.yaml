name: sakina
description: "Sakina - Coran, horaires de prière, Qibla, adhkar et hadiths"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  adhan_dart: ^2.0.1
  drift: ^2.35.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  hijri: ^3.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.6.0
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  flutter_compass: ^0.8.1
  geomag: ^0.3.0
  share_plus: ^13.3.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

  # Used only by tool/content_pipeline (builds assets/db/content.sqlite).
  archive: ^4.3.0
  crypto: ^3.0.7
  http: ^1.6.0
  xml: ^7.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/licenses/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
